# Template only -- do not apply this file as-is or commit a filled-in copy.
# Real values come from `terraform output` (rds_endpoint, sync_queue_url) plus
# your GitHub webhook secret and Anthropic API key. In an actual pipeline,
# generate this with `kubectl create secret generic ... --dry-run=client -o
# yaml` from CI/CD secrets or External Secrets Operator synced from AWS
# Secrets Manager (aws_secretsmanager_secret.db_password in terraform/rds.tf
# already puts the DB password there) -- never hand-edit and commit real
# values into this repo.
apiVersion: v1
kind: Secret
metadata:
  name: portal-secrets
  namespace: vcode-fr-hc
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://portal:<DB_PASSWORD>@<RDS_ENDPOINT>:5432/portal"
  SYNC_QUEUE_SQS_URL: "<terraform output sync_queue_url>"
  GITHUB_WEBHOOK_SECRET: "<openssl rand -hex 32>"
  ANTHROPIC_API_KEY: "<your key, if the chat feature is in use>"
  PEXELS_API_KEY: ""
