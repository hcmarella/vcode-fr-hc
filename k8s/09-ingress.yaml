# Requires the AWS Load Balancer Controller add-on installed in the cluster
# (not included here -- it's cluster-wide infra, typically installed via its
# own Helm chart once per cluster, not per-app). Provisions an ALB, routes
# /api/* and /healthz to the backend Service, everything else to frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-ingress
  namespace: vcode-fr-hc
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERTIFICATE_ARN>" # terraform var.acm_certificate_arn
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  rules:
    - host: "<DOMAIN_NAME>" # terraform var.domain_name
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
