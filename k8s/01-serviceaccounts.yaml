# eks.amazonaws.com/role-arn values come from `terraform output
# backend_irsa_role_arn` / `worker_irsa_role_arn` -- fill in after `terraform
# apply`. This is what lets these pods call SQS without static AWS keys
# anywhere in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-api
  namespace: vcode-fr-hc
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/vcode-fr-hc-prod-backend"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sync-worker
  namespace: vcode-fr-hc
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/vcode-fr-hc-prod-worker"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: vcode-fr-hc
  # No AWS permissions needed -- nginx serving static assets + proxying to
  # the backend Service, nothing that talks to AWS APIs directly.
