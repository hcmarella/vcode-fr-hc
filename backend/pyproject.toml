[project]
name = "vcode-fr-hc-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "docker>=7.1",
    "anthropic>=0.40",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# Only needed when SYNC_QUEUE_BACKEND=sqs (EKS/prod). Kept out of base
# dependencies so the postgres-backend (default/local) image stays lean.
aws = [
    "boto3>=1.35",
]
prod = [
    "gunicorn>=23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
